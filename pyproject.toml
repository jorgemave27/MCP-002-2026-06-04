[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adr-mcp-server"
version = "1.0.0"
description = "MCP server for Architecture Decision Records with AI-assisted reasoning, semantic search, and conflict detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MCP-002", email = "maintainers@example.com" }
]
keywords = ["mcp", "adr", "architecture", "ai", "sqlite", "semantic-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=1.9.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "sqlite-vec>=0.1.6; platform_system != 'Windows'",
  "typing-extensions>=4.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "jsonschema>=4.22.0",
  "build>=1.2.0"
]
tokens = ["tiktoken>=0.7.0"]

[project.urls]
Homepage = "https://github.com/your-org/adr-mcp-server"
Repository = "https://github.com/your-org/adr-mcp-server"
Issues = "https://github.com/your-org/adr-mcp-server/issues"

[project.scripts]
adr-mcp-server = "adr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=adr_mcp --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "mcp.*"]
ignore_missing_imports = true
